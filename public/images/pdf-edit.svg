<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="260" cy="225" r="140" fill="#ef4444" opacity="0.12" filter="url(#glow)" />
  <circle cx="580" cy="225" r="160" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- PDF Document Window Mockup -->
  <g transform="translate(100, 75)">
    <!-- Document Card Shadow & Base -->
    <rect x="0" y="0" width="280" height="310" rx="14" fill="#181825" stroke="#313244" stroke-width="2" />
    
    <!-- Top Document Header -->
    <rect x="0" y="0" width="280" height="42" rx="14" fill="#1e1e2e" />
    <rect x="0" y="28" width="280" height="14" fill="#1e1e2e" />
    <circle cx="22" cy="21" r="5" fill="#f38ba8" />
    <circle cx="38" cy="21" r="5" fill="#f9e2af" />
    <circle cx="54" cy="21" r="5" fill="#a6e3a1" />
    <text x="75" y="26" fill="#a6adc8" font-family="monospace" font-size="11" font-weight="600">document_edit.pdf</text>

    <!-- PDF Icon Badge -->
    <rect x="22" y="60" width="46" height="56" rx="6" fill="url(#pdfGrad)" filter="url(#glow)" />
    <text x="32" y="96" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900">PDF</text>

    <!-- Document Content Lines / Skeleton -->
    <rect x="80" y="66" width="170" height="8" rx="4" fill="#45475a" />
    <rect x="80" y="84" width="130" height="7" rx="3.5" fill="#313244" />
    <rect x="80" y="100" width="150" height="7" rx="3.5" fill="#313244" />

    <!-- Simulated OCR / Highlight Box -->
    <rect x="22" y="132" width="236" height="36" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="34" y="154" fill="#fde68a" font-family="monospace" font-size="11">🔍 OCR Text Extracted: 99.8%</text>

    <!-- Canvas Drawing / Annotation Vectors -->
    <rect x="22" y="184" width="236" height="60" rx="6" fill="#11111b" stroke="#313244" stroke-width="1" />
    <path d="M 36 226 Q 70 200, 110 220 T 170 210 T 220 224" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <text x="36" y="202" fill="#89dceb" font-family="monospace" font-size="9">✎ Fabric.js Interactive Pen</text>

    <!-- Signature Stamp -->
    <g transform="translate(160, 256)">
      <rect x="0" y="0" width="98" height="28" rx="4" fill="#1e1e2e" stroke="#ef4444" stroke-width="1" />
      <text x="14" y="18" fill="#f38ba8" font-family="sans-serif" font-size="10" font-weight="bold">✓ Signed</text>
    </g>
  </g>

  <!-- Right Side: Feature Highlights & Branding -->
  <g transform="translate(420, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text x="14" y="17" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">★ React 19 + Vite Studio</text>

    <!-- Main Title -->
    <text x="0" y="62" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">PDF &amp; Image Editor</text>
    <text x="0" y="92" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="500">Fast, Private &amp; Client-Side Studio</text>

    <!-- Feature Checklist -->
    <g transform="translate(0, 120)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="7" fill="#10b981" />
      <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Fabric.js Annotate, Draw &amp; Sign</text>

      <!-- Item 2 -->
      <circle cx="8" cy="38" r="7" fill="#10b981" />
      <path d="M 5 38 L 7 40 L 11 36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Tesseract.js In-Browser OCR</text>

      <!-- Item 3 -->
      <circle cx="8" cy="68" r="7" fill="#10b981" />
      <path d="M 5 68 L 7 70 L 11 66" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">PDF-lib &amp; PDF.js Page Engine</text>
    </g>

    <!-- Tech Stack Pill Group -->
    <g transform="translate(0, 224)">
      <rect x="0" y="0" width="78" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" fill="#38bdf8" font-family="monospace" font-size="11">React 19</text>

      <rect x="88" y="0" width="94" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="98" y="16" fill="#a78bfa" font-family="monospace" font-size="11">Tailwind v4</text>

      <rect x="192" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="202" y="16" fill="#f43f5e" font-family="monospace" font-size="11">Client Privacy</text>
    </g>
  </g>
</svg>
