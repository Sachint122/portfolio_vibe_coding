      <text x="12" y="16" fill="#34d399" font-family="monospace" font-size="11">Java 17</text>

      <rect x="70" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="78" y="16" fill="#38bdf8" font-family="monospace" font-size="11">LiteRT-LM</text>

      <rect x="168" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="178" y="16" fill="#a78bfa" font-family="monospace" font-size="11">MVVM</text>

      <rect x="248" y="0" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="258" y="16" fill="#f59e0b" font-family="monospace" font-size="11">SAF JSON</text>

