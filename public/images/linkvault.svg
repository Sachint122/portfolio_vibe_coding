      <rect x="0" y="0" width="184" height="58" rx="8" fill="#131e2d" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="8" fill="#0284c7" />
      <text x="12" y="22" fill="#ffffff" font-family="sans-serif" font-size="9">🔗</text>
      <text x="30" y="17" fill="#f1f5f9" font-family="sans-serif" font-size="9" font-weight="600">Android On-Device AI</text>
