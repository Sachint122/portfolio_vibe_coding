      <path d="M 5 98 L 7 100 L 11 96" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">User-Owned SAF JSON Storage • Signed APK Available</text>
