      <text x="30" y="44" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Auto folder 'Tech' • 2 tags generated.</text>
      <rect x="30" y="48" width="46" height="8" rx="2" fill="#0369a1" fill-opacity="0.3" />

      <!-- Item 2 -->
      <rect x="0" y="66" width="184" height="58" rx="8" fill="#131e2d" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="84" r="8" fill="#7c3aed" />
      <text x="12" y="88" fill="#ffffff" font-family="sans-serif" font-size="9">📁</text>
      <text x="30" y="83" fill="#f1f5f9" font-family="sans-serif" font-size="9" font-weight="600">SAF User-Owned Folder</text>
      <text x="140" y="82" fill="#a78bfa" font-family="monospace" font-size="8">JSON</text>
