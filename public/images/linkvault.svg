      <path d="M 5 38 L 7 40 L 11 36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">On-Device AI (LiteRT-LM Qwen3) 2-Line Summaries</text>

      <!-- Item 3 -->
      <circle cx="8" cy="68" r="7" fill="#06b6d4" />
      <path d="M 5 68 L 7 70 L 11 66" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
