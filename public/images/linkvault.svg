      <text x="30" y="110" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Copy-only imports ≤ 100MB supported.</text>

      <!-- Item 3: Daily Auto-Clean -->
      <rect x="0" y="132" width="184" height="52" rx="8" fill="#131e2d" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="150" r="8" fill="#059669" />
      <text x="12" y="154" fill="#ffffff" font-family="sans-serif" font-size="9">🧹</text>
      <text x="30" y="149" fill="#f1f5f9" font-family="sans-serif" font-size="9" font-weight="600">Daily AI Auto-Clean</text>
      <text x="136" y="148" fill="#10b981" font-family="monospace" font-size="8">Active</text>
      <text x="30" y="164" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Removes 30d unused folders on disk.</text>
      <text x="30" y="176" fill="#94a3b8" font-family="sans-serif" font-size="7.5">Links never deleted • Safe guarantee.</text>
