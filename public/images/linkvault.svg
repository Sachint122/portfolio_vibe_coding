    <text x="48" y="54" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">LinkVault</text>
    <rect x="135" y="42" width="58" height="16" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="141" y="53" fill="#6ee7b7" font-family="monospace" font-size="8" font-weight="bold">v1.1.0 AI</text>

